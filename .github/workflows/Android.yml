name: Build Devre for Android

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user

      - name: Download sse2neon Header
        run: |
          curl -sL https://raw.githubusercontent.com/DLTcollab/sse2neon/master/sse2neon.h -o sse2neon.h

      - name: Patch SIMD Headers and aligned_alloc
        run: |
          python3 -c '
          import os

          def patch_file(path):
              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()

              original = content

              if "<immintrin.h>" in content:
                  content = content.replace("<immintrin.h>", "\"sse2neon.h\"")

              if "std::aligned_alloc" in content:
                  content = content.replace(
                      "ptr = std::aligned_alloc(Alignment, std::max(alignedBytes, Alignment));",
                      "posix_memalign(&ptr, Alignment, std::max(alignedBytes, Alignment));"
                  )

              if content != original:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"Patched: {path}")

          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith((".h", ".hpp", ".cpp", ".c")):
                      patch_file(os.path.join(root, file))
          '

      - name: Download Evaluation Network
        run: |
          if [ ! -f "devre_mc.bin" ]; then
            curl -sL "https://github.com/OmerFarukTutkun/DevreNets/raw/main/devre_mc.bin" -o devre_mc.bin
          fi
          echo "Downloaded devre_mc.bin size: $(stat -c%s devre_mc.bin) bytes"

      - name: Inspect Devre Source Embedding References
        run: |
          python3 -c '
          import os

          print("=== DEVRE SOURCE EMBEDDING DIAGNOSTICS ===")
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith((".cpp", ".h", ".hpp")):
                      path = os.path.join(root, file)
                      with open(path, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                      lines = content.splitlines()
                      for idx, line in enumerate(lines):
                          if any(k in line for k in ["EMBED", "incbin", "gNetData", "devre_mc", "fopen"]):
                              print(f"{path}:{idx+1}: {line.strip()}")
          '

      - name: Build Devre for Android ARM64 (Statically Linked & Embedded Net)
        run: |
          NDK_CXX="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"
          NDK_CC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"

          # 1. Compile C tablebase sources separately
          find . -type f -name "tbprobe.c" -exec $NDK_CC -O3 -c {} -o tbprobe.o \;

          # 2. Create assembly wrapper exporting all standard symbol variants for the network
          cat > net_wrapper.s << 'EOF'
          .section .rodata,"a",@progbits
          .align 8
          .global _binary_devre_mc_bin_start
          .global _binary_devre_mc_bin_end
          .global _binary_devre_mc_bin_size
          .global _binary_net_bin_start
          .global _binary_net_bin_end
          .global gNetDataStart
          .global gNetDataEnd
          .global incbin_net_start
          .global incbin_net_end

          _binary_devre_mc_bin_start:
          _binary_net_bin_start:
          gNetDataStart:
          incbin_net_start:
          .incbin "devre_mc.bin"

          _binary_devre_mc_bin_end:
          _binary_net_bin_end:
          gNetDataEnd:
          incbin_net_end:

          _binary_devre_mc_bin_size:
          .quad _binary_devre_mc_bin_end - _binary_devre_mc_bin_start
          EOF

          # Assemble network wrapper directly for ARM64
          $NDK_CC -c net_wrapper.s -o net.o

          CPP_SOURCES=$(find . -type f -name "*.cpp" ! -path "*/devre_pgo/*")

          echo "Compiling Devre with forced network section embedding..."
          $NDK_CXX -O3 -flto -std=c++17 -pthread \
            -fconstexpr-steps=100000000 \
            -static-libstdc++ \
            -D__SSSE3__ \
            -DEMBED -DNET_EMBED -DMAKE_EMBED -DINC_NET \
            -I. -Isrc -D TB_NO_HELPER_API -DNET=\"devre_mc.bin\" \
            $CPP_SOURCES tbprobe.o \
            -Wl,--whole-archive net.o -Wl,--no-whole-archive \
            -lm -o Devre-android-arm64

          # 3. Verify final binary size
          SIZE_BYTES=$(stat -c%s Devre-android-arm64)
          NET_BYTES=$(stat -c%s devre_mc.bin)
          echo "Engine Binary Size: $SIZE_BYTES bytes ($(($SIZE_BYTES / 1024 / 1024)) MB)"
          echo "Network File Size:  $NET_BYTES bytes ($(($NET_BYTES / 1024 / 1024)) MB)"

          mkdir -p dist/bin
          mv Devre-android-arm64 dist/bin/

      - name: Verify Android Binary
        run: |
          ls -lh dist/bin/
          file dist/bin/*

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devre-android-arm64
          path: dist/bin/*
