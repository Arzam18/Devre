      - name: Build Devre for Android ARM64 (Statically Linked & Embedded Net)
        run: |
          NDK_CXX="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"
          NDK_CC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"
          OBJCOPY="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy"

          # 1. Compile C tablebase sources separately
          find . -type f -name "tbprobe.c" -exec $NDK_CC -O3 -c {} -o tbprobe.o \;

          # 2. Convert network file to an ARM64 object file for linker embedding
          $OBJCOPY -I binary -O elf64-littleaarch64 -B aarch64 devre_mc.bin net.o

          CPP_SOURCES=$(find . -type f -name "*.cpp" ! -path "*/devre_pgo/*")

          echo "Compiling Devre with embedded NNUE network..."
          $NDK_CXX -O3 -flto -std=c++17 -pthread \
            -fconstexpr-steps=100000000 \
            -static-libstdc++ \
            -D__SSSE3__ \
            -DEMBED -DNET_EMBED -DMAKE_EMBED \
            -I. -Isrc -D TB_NO_HELPER_API -DNET=\"devre_mc.bin\" \
            $CPP_SOURCES tbprobe.o net.o -lm -o Devre-android-arm64

          # 3. Assert binary size (fail workflow if net is missing)
          SIZE_BYTES=$(stat -c%s Devre-android-arm64)
          echo "Generated binary size: $(($SIZE_BYTES / 1024 / 1024)) MB ($SIZE_BYTES bytes)"
          if [ "$SIZE_BYTES" -lt 10000000 ]; then
            echo "ERROR: Binary is under 10 MB. Network file failed to embed!"
            exit 1
          fi

          mkdir -p dist/bin
          mv Devre-android-arm64 dist/bin/
