name: Build Devre for Android

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user

      - name: Download sse2neon Header
        run: |
          curl -sL https://raw.githubusercontent.com/DLTcollab/sse2neon/master/sse2neon.h -o sse2neon.h

      - name: Patch SIMD Headers and aligned_alloc
        run: |
          python3 -c '
          import os

          def patch_file(path):
              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()

              original = content

              if "<immintrin.h>" in content:
                  content = content.replace("<immintrin.h>", "\"sse2neon.h\"")

              if "std::aligned_alloc" in content:
                  content = content.replace(
                      "ptr = std::aligned_alloc(Alignment, std::max(alignedBytes, Alignment));",
                      "posix_memalign(&ptr, Alignment, std::max(alignedBytes, Alignment));"
                  )

              if content != original:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"Patched: {path}")

          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith((".h", ".hpp", ".cpp", ".c")):
                      patch_file(os.path.join(root, file))
          '

      - name: Download Main Evaluation Network
        run: |
          NETWORK_NAME="devre-a064d8d9d7b6.bin"
          if [ ! -f "$NETWORK_NAME" ]; then
            curl -sL "https://github.com/OmerFarukTutkun/DevreNets/raw/main/$NETWORK_NAME" -o "$NETWORK_NAME"
          fi
          echo "NETWORK_NAME=$NETWORK_NAME" >> $GITHUB_ENV
          echo "Downloaded $NETWORK_NAME size: $(stat -c%s $NETWORK_NAME) bytes"

      - name: Build Devre for Android ARM64
        run: |
          NDK_CXX="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"
          NDK_CC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"

          # 1. Compile C tablebase sources separately
          find . -type f -name "tbprobe.c" -exec $NDK_CC -O3 -c {} -o tbprobe.o \;

          CPP_SOURCES=$(find . -type f -name "*.cpp" ! -path "*/devre_pgo/*")

          echo "Compiling Devre with main network $NETWORK_NAME..."
          $NDK_CXX -O3 -flto -std=c++17 -pthread \
            -fconstexpr-steps=100000000 \
            -static-libstdc++ \
            -D__SSSE3__ \
            -I. -Isrc -D TB_NO_HELPER_API \
            -DNET=\"$NETWORK_NAME\" \
            $CPP_SOURCES tbprobe.o -lm -o Devre-android-arm64

          # 2. Verify final binary size
          SIZE_BYTES=$(stat -c%s Devre-android-arm64)
          SIZE_MB=$(($SIZE_BYTES / 1024 / 1024))
          echo "Final Executable Size: $SIZE_BYTES bytes ($SIZE_MB MB)"

          mkdir -p dist/bin
          mv Devre-android-arm64 dist/bin/

      - name: Verify Android Binary
        run: |
          ls -lh dist/bin/
          file dist/bin/*

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devre-android-arm64
          path: dist/bin/*
