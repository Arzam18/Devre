name: Build Devre for Android

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user

      - name: Download sse2neon Header
        run: |
          curl -sL https://raw.githubusercontent.com/DLTcollab/sse2neon/master/sse2neon.h -o sse2neon.h

      - name: Patch SIMD Headers and aligned_alloc
        run: |
          python3 -c '
          import os

          def patch_file(path):
              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()

              original = content

              if "<immintrin.h>" in content:
                  content = content.replace("<immintrin.h>", "\"sse2neon.h\"")

              if "std::aligned_alloc" in content:
                  content = content.replace(
                      "ptr = std::aligned_alloc(Alignment, std::max(alignedBytes, Alignment));",
                      "posix_memalign(&ptr, Alignment, std::max(alignedBytes, Alignment));"
                  )

              if content != original:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"Patched: {path}")

          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith((".h", ".hpp", ".cpp", ".c")):
                      patch_file(os.path.join(root, file))
          '

      - name: Download Evaluation Network
        run: |
          if [ ! -f "devre_mc.bin" ]; then
            curl -sL "https://github.com/OmerFarukTutkun/DevreNets/raw/main/devre_mc.bin" -o devre_mc.bin
          fi
          echo "NET_SIZE_BYTES=$(stat -c%s devre_mc.bin)" >> $GITHUB_ENV
          echo "Downloaded devre_mc.bin size: $(stat -c%s devre_mc.bin) bytes"

      - name: Build Devre for Android ARM64 (Embedded Net)
        run: |
          NDK_CXX="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"
          NDK_CC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"

          # 1. Compile C tablebase files
          find . -type f -name "tbprobe.c" -exec $NDK_CC -O3 -c {} -o tbprobe.o \;

          # 2. Create assembly wrapper for net in .rodata.net
          cat > net_data.s << 'EOF'
          .section .rodata.net,"a",@progbits
          .align 8
          .global embedded_net_data
          .global embedded_net_data_end
          .global _binary_devre_mc_bin_start
          .global _binary_devre_mc_bin_end

          embedded_net_data:
          _binary_devre_mc_bin_start:
              .incbin "devre_mc.bin"
          embedded_net_data_end:
          _binary_devre_mc_bin_end:
          EOF

          # 3. Create C++ anchor file
          cat > net_keep.cpp << 'EOF'
          #include <cstdint>

          extern "C" {
              extern const uint8_t embedded_net_data[];
              extern const uint8_t embedded_net_data_end[];
          }

          __attribute__((used, visibility("default")))
          const void* const g_net_ptr_keep = (const void*)embedded_net_data;

          __attribute__((used, visibility("default")))
          const void* const g_net_end_keep = (const void*)embedded_net_data_end;
          EOF

          $NDK_CC -c net_data.s -o net_data.o
          $NDK_CXX -O3 -std=c++17 -c net_keep.cpp -o net_keep.o

          CPP_SOURCES=$(find . -type f -name "*.cpp" ! -name "net_keep.cpp" ! -path "*/devre_pgo/*")

          echo "Linking Devre with embedded NNUE network..."
          $NDK_CXX -O3 -flto -std=c++17 -pthread \
            -fconstexpr-steps=100000000 \
            -static-libstdc++ \
            -D__SSSE3__ \
            -DEMBED -DNET_EMBED -DMAKE_EMBED -DINC_NET \
            -I. -Isrc -D TB_NO_HELPER_API -DNET=\"devre_mc.bin\" \
            $CPP_SOURCES tbprobe.o net_data.o net_keep.o \
            -Wl,-u,embedded_net_data -Wl,-u,_binary_devre_mc_bin_start \
            -lm -o Devre-android-arm64

          # 4. Dynamic Verification: Executable must be larger than net file
          SIZE_BYTES=$(stat -c%s Devre-android-arm64)
          SIZE_MB=$(($SIZE_BYTES / 1024 / 1024))
          echo "Final Executable Size: $SIZE_BYTES bytes ($SIZE_MB MB)"

          if [ "$SIZE_BYTES" -le "$NET_SIZE_BYTES" ]; then
            echo "ERROR: Executable size ($SIZE_BYTES bytes) is smaller than the network file ($NET_SIZE_BYTES bytes)!"
            exit 1
          fi

          mkdir -p dist/bin
          mv Devre-android-arm64 dist/bin/

      - name: Verify Android Binary
        run: |
          ls -lh dist/bin/
          file dist/bin/*

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devre-android-arm64
          path: dist/bin/*
