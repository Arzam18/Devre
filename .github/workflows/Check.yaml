- name: Build Devre for Android ARM64 (Statically Linked)
        run: |
          NDK_CXX="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"
          
          # Include all .cpp files and ONLY tbprobe.c
          SOURCES=$(find . -type f \( -name "*.cpp" -o -name "tbprobe.c" \) ! -path "*/devre_pgo/*")

          echo "Compiling with Android NDK Clang++ (Statically linked C++ runtime)..."
          $NDK_CXX -O3 -flto -std=c++17 -pthread \
            -static-libstdc++ \
            -D__SSSE3__ \
            -I. -Isrc -D TB_NO_HELPER_API -DNET=\"devre_mc.bin\" \
            $SOURCES -lm -o Devre-android-arm64

          mkdir -p dist/bin
          mv Devre-android-arm64 dist/bin/

      - name: Verify macro defines under our build flags
        run: |
          NDK_CXX="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"
          echo | $NDK_CXX -O3 -std=c++17 -D__SSSE3__ -E -dM - | grep -E "__AVX2__|__SSSE3__|__AVX512"

      - name: Verify Android Binary
        run: |
          ls -lh dist/bin/
          file dist/bin/*
